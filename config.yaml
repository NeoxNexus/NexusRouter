router:
  port: 8402
  classifier: hybrid
  # 监听地址。默认只绑回环双栈（IPv4 + IPv6），同网段其他机器无法访问，
  # 避免 config 里的 API 额度被别人白嫖。localhost 解析成 ::1 时也能连。
  # 如需暴露到局域网，显式改为 hosts: ["0.0.0.0"]（务必自行加鉴权/防火墙）。
  hosts: ["127.0.0.1", "::1"]
  # 上游请求超时（毫秒）。schema 默认 1000ms 对真实 LLM 调用必超时，生产必须显式设置
  timeout: 300000
  layers:
    rules:
      enabled: true
    heuristic:
      confidenceThreshold: 0.92
    ai:
      fallbackConfidence: 0.75

providers:
  # gorouter.app（new-api 网关）说 Anthropic 协议，四档模型全部走这里。
  # passthroughApiKey: CC-Switch 传来的 sk 原样转发给 gorouter，按个人令牌计费。
  # 上游地址由本文件钉死，客户端令牌不可能被转发到别处。
  anthropic:
    baseUrl: https://gorouter.app
    passthroughApiKey: true
    maxRetries: 3

# 四档从低到高对应 gorouter 的实际开通模型。
# 注意：转发时 `anthropic/` 前缀会被剥掉，上游收到的是斜杠后面的裸模型名。
tiers:
  SIMPLE:
    primary: anthropic/claude-opus-4-8
    fallback: []
  MEDIUM:
    primary: anthropic/claude-opus-4-8-thinking
    fallback: []
  COMPLEX:
    primary: anthropic/claude-opus-5
    fallback: []
  REASONING:
    primary: anthropic/claude-opus-5-thinking
    fallback: []

# Agent 提示如何影响路由档位。
# thinking 开关：CC 设置 CLAUDE_CODE_EFFORT_LEVEL 后每轮请求都带 thinking，
# 恒真信号不携带单轮信息量 —— 默认 off，分类器说了算。
#   off       (默认) thinking 不参与档位融合
#   complex           thinking 请求至少 COMPLEX
#   reasoning         thinking 请求至少 REASONING（旧行为）
hints:
  thinking: off

# Ollama 本地小模型分类层。服务器上没装 Ollama 时必须保持 false，
# 否则每个请求都要等连接失败降级，白白增加延迟
ollama:
  enabled: false
  baseUrl: http://localhost:11434
  models:
    fast: qwen3.5:2b
    accurate: qwen3.5:4b
  timeout: 30000
